apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: memoharbor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memoharbor-deployer
  namespace: memoharbor
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [memoharbor]
    verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memoharbor-deployer
  namespace: memoharbor
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: memoharbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memoharbor-deployer
